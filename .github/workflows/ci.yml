name: CI

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
      retain-package:
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install release-check tools
        run: |
          npm install --global --no-audit --no-fund pnpm@11.22.0 @deepseek-ai/dsh@0.2.0-rc.2 @deepseek-harness-tui/dsh-tui@0.20.0
          echo "DSH_TUI_DIR=$(npm root -g)/@deepseek-harness-tui/dsh-tui" >> "$GITHUB_ENV"
      - name: Run full release checks
        env:
          DSH_PACE_RELEASE_DIR: ${{ inputs.retain-package && runner.temp || '' }}
        run: npm run check:release
      - uses: actions/upload-artifact@v4
        if: inputs.retain-package
        with:
          name: tested-package
          path: ${{ runner.temp }}/powerflow-ai-dsh-pace-*.tgz
          if-no-files-found: error
          retention-days: 7

  windows-pwsh:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise the DSH PowerShell tool
        shell: pwsh
        run: |
          npm install --global --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:DSH_HOST_DIR = Join-Path (npm root -g) '@deepseek-ai/dsh'
          node .github/scripts/check-pwsh.mjs
