name: Rehearse npm release
run-name: Rehearse ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['rehearse/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (e.g. v0.1.1)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locate release commit and verify its CI
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${INPUT_TAG:-${GITHUB_REF_NAME#rehearse/}}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          gh run list --workflow ci.yml --branch main --event push --commit "$sha" \
            --json conclusion,url | jq -er 'map(select(.conclusion == "success")) | first | .url'
          git worktree add --detach "$RUNNER_TEMP/pace-source" "$sha"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release source: $sha"
      - name: Pack, dry-run and compare the public npm release
        run: |
          cd "$RUNNER_TEMP/pace-source"
          python3 "$GITHUB_WORKSPACE/.github/scripts/rehearse-release.py" "$RELEASE_TAG"
