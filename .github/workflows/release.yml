name: Stage npm release
run-name: Stage ${{ github.ref_name }} for npm approval

on:
  push:
    tags: ['v*', 'stage/v*']

permissions:
  contents: read

jobs:
  version:
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, release manifests and README
        id: source
        run: |
          # A stage/v* tag retries the original release with the current workflow.
          tag=${GITHUB_REF_NAME#stage/}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git diff --exit-code origin/main HEAD -- README.md
          RELEASE_TAG="$tag" node --input-type=commonjs <<'JS'
          const assert = require('node:assert/strict')
          const pkg = require('./package.json')
          assert.equal(pkg.name, '@powerflow-ai/dsh-pace')
          assert.equal('v' + pkg.version, process.env.RELEASE_TAG)
          assert.equal(pkg.version, require('./dsh-plugin.json').version)
          JS

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      source-sha: ${{ needs.version.outputs.sha }}
      retain-package: true

  stage:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select npm CLI with staged publishing support
        run: npm install --global --ignore-scripts npm@11.20.0
      - uses: actions/download-artifact@v4
        with:
          name: tested-package
          path: dist
      - name: Submit verified tarball to npm for approval
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          archive="$GITHUB_WORKSPACE/dist/powerflow-ai-dsh-pace-${RELEASE_TAG#v}.tgz"
          tar -xOf "$archive" package/README.md | cmp - README.md
          sha512sum "$archive"
          npm stage publish "$archive" --registry=https://registry.npmjs.org/ --access public --tag latest
